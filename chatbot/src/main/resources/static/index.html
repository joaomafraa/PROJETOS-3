<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico de conversas · WXN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172638;font-family:system-ui,sans-serif}main{max-width:1100px;padding:32px 20px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:16px}h1{margin:6px 0;font-size:28px}h2{margin:0 0 12px;font-size:19px}p{line-height:1.5}.muted{color:#536579}.brand{font-weight:800;color:#145f76}.layout{display:grid;grid-template-columns:330px 1fr;gap:20px;margin-top:20px}section{background:white;border:1px solid #dce2e9;border-radius:12px;padding:20px;min-width:0}button{cursor:pointer;border:1px solid #b8c7d3;border-radius:8px;background:white;color:#172638;padding:11px 14px;font:inherit}button:hover{background:#edf5f8}button:focus-visible{outline:3px solid #1781a1;outline-offset:2px}button:disabled{cursor:wait;opacity:.6}#conversas{display:grid;gap:10px;max-height:65vh;overflow:auto;padding:3px}.conversa{text-align:left;width:100%}.conversa span{display:block;margin-top:5px;font-size:13px}.conversa[aria-pressed="true"]{background:#e9f5f8;border-color:#16728c}#mensagens{list-style:none;padding:0;margin:0;display:grid;gap:14px}.mensagem{border-left:3px solid #adc0d1;padding:12px 16px;background:#f6f8fa;border-radius:6px}.mensagem.humano{border-color:#16816d;background:#eff8f5}.mensagem p{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0}time{color:#536579;font-size:12px;display:block;margin-top:4px}#aviso{min-height:24px}.erro{color:#a52a25}@media(max-width:720px){.layout{grid-template-columns:1fr}header{align-items:flex-start}#conversas{max-height:280px}}
</style>
</head>
<body><main>
<header><div><div class="brand">WXN · Atendimento</div><h1>Histórico de conversas</h1><p class="muted">Selecione uma conversa para ler as mensagens salvas.</p></div><div><button id="exemplo" type="button">Criar atendimento de exemplo</button> <button id="atualizar" type="button">Atualizar</button></div></header>
<p id="aviso" role="status" aria-live="polite"></p>
<div class="layout">
<section aria-labelledby="titulo-lista"><h2 id="titulo-lista">Conversas</h2><p class="muted">Até 100 conversas, da mais recente à mais antiga.</p><div id="conversas"></div></section>
<section aria-labelledby="titulo-historico"><h2 id="titulo-historico">Mensagens</h2><p id="detalhes" class="muted">Escolha uma conversa na lista.</p><ol id="mensagens"></ol></section>
</div></main><script src="/historico.js" defer></script></body>
</html>
