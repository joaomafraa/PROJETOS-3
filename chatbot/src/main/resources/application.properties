spring.application.name=chatbot
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Bootstrap opt-in da primeira credencial administrativa. Depois do primeiro uso,
# mantenha AUTH_BOOTSTRAP_ENABLED=false e remova a senha do ambiente.
wxn.security.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
wxn.security.bootstrap.admin-email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
wxn.security.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
