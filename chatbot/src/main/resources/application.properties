spring.application.name=chatbot
server.port=${PORT:8080}
server.address=0.0.0.0
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Bootstrap opt-in da primeira credencial administrativa. Depois do primeiro uso,
# mantenha AUTH_BOOTSTRAP_ENABLED=false e remova a senha do ambiente.
wxn.security.bootstrap.enabled=${AUTH_BOOTSTRAP_ENABLED:false}
wxn.security.bootstrap.admin-email=${AUTH_BOOTSTRAP_ADMIN_EMAIL:}
wxn.security.bootstrap.admin-password=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}

# Spring AI usando a API compatível da Groq
spring.ai.openai.api-key=${GROQ_API_KEY:nao-configurada}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.replay-reasoning-content=false
# Limite de tokens da resposta (inclui o raciocinio em modelos de raciocinio)
spring.ai.openai.chat.max-tokens=${GROQ_MAX_TOKENS:1500}

nexus.telegram.polling.enabled=${TELEGRAM_POLLING_ENABLED:false}
nexus.telegram.empresa-id=${TELEGRAM_EMPRESA_ID:0}
nexus.telegram.chatbot-id=${TELEGRAM_CHATBOT_ID:0}

# SMTP e opt-in: sem servidor e remetente configurados o envio fica indisponivel.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
nexus.validacao.email-remetente=${SMTP_FROM:}
